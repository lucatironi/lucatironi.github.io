        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: #111;
            color: #fff;
            padding: 40px 20px;
        }

        /* Typography Header */
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 1.05rem;
            font-weight: 300;
            color: #aaa;
            margin: 0;
            letter-spacing: 0.2px;
        }

        /* Masonry Layout */
        .masonry-grid {
            column-count: 4;
            column-gap: 15px;
        }
        @media (max-width: 1024px) { .masonry-grid { column-count: 3; } }
        @media (max-width: 768px) { .masonry-grid { column-count: 2; } }
        @media (max-width: 480px) { .masonry-grid { column-count: 1; } }

        /* Masonry Items with Loading Animation */
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 15px;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            background: #222;
            min-height: 150px;
            position: relative;
        }

        .masonry-item::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, #222 25%, #333 50%, #222 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            z-index: 1;
        }
        .masonry-item.loaded::before {
            display: none;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.5s ease, transform 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .masonry-item.loaded img {
            opacity: 1;
            transform: scale(1);
        }
        .masonry-item.loaded:hover img {
            transform: scale(1.03);
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }
        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Top-Right Icon Controls Stacked Vertically */
        .lightbox-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1010;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(4px);
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.08);
        }
        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Spinner for Lightbox Loading */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
            display: none;
        }
        .lightbox.loading .spinner {
            display: block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .lightbox img.loaded {
            opacity: 1;
            transform: scale(1);
        }
    </style>
